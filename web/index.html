<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5c45" data-default="#1f5c45" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1714" data-default="#0e1714" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors attributeFor() in src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("gl.theme");
          var band = { light: "#1f5c45", dark: "#12241c", holiday: "#8a1a2b" }[t];
          if (band) {
            document.documentElement.setAttribute("data-theme", t);
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", band);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gifts" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Gift List</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
